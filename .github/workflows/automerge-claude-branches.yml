name: Auto-merge Claude routine branches

# Automatically merges pull requests that Claude Code Routines open when a
# routine run can't push directly to main (see trigger-phase-a.yml /
# trigger-phase-b.yml). Restricted to branches the routines create
# (claude/**) merging into main, so this only ever touches PRs opened by
# the automation itself.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --merge \
            --delete-branch
