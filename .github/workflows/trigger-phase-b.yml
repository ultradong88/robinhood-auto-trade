name: Trigger FriesTrader Phase B

# Backup/manual trigger only. Scheduling now lives on cron-job.org (job
# "FriesTrader Phase B", crontab 35 8 * * 1-5 America/Chicago), because
# GitHub Actions' own `schedule:` trigger fires 5-10 hours late and was
# double-firing this routine alongside cron-job.org. This workflow is kept
# only so it can still be run by hand from the Actions tab if ever needed.
#
# Required GitHub repo config (Settings -> Secrets and variables -> Actions)
# is unchanged:
#   - Variable PHASE_B_ROUTINE_ID
#   - Secret   PHASE_B_ROUTINE_TOKEN

on:
  workflow_dispatch: {}

jobs:
  fire-routine:
    runs-on: ubuntu-latest
    steps:
      - name: POST to the Phase B routine's /fire endpoint
        run: |
          set -euo pipefail
          if [ -z "${PHASE_B_ROUTINE_ID:-}" ] || [ -z "${PHASE_B_ROUTINE_TOKEN:-}" ]; then
            echo "::error::PHASE_B_ROUTINE_ID (variable) or PHASE_B_ROUTINE_TOKEN (secret) is not set." >&2
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${PHASE_B_ROUTINE_ID}/fire" \
            -H "Authorization: Bearer ${PHASE_B_ROUTINE_TOKEN}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d '{}'
        env:
          PHASE_B_ROUTINE_ID: ${{ vars.PHASE_B_ROUTINE_ID }}
          PHASE_B_ROUTINE_TOKEN: ${{ secrets.PHASE_B_ROUTINE_TOKEN }}
